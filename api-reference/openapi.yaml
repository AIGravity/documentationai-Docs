openapi: '3.0.3'
info:
  version: 1.0.0
  title: AIGravity Core API Service
  description: |
    This specification documents the API service for the AIGravity/core monorepo.

    It covers the NestJS API service endpoints for health, connections, marketplace, apps, and agents, including deprecated legacy routes retained here for reference.

    Currently documented areas include:
    - `GET /health`
    - Composio connection and authentication endpoints under `/api/connections`
    - Marketplace builder field endpoints under `/api/marketplace`
    - Pending app wishlist management under `/api/apps`
    - Deprecated legacy endpoints under `/api/n8n-workflow` and `/api/inngest-trigger`

    The repository also contains a separate AI service implemented with FastAPI that exposes its own `GET /health` endpoint. That endpoint is not described in this API reference specification.

    Authentication:
    - Protected endpoints require a Supabase Bearer JWT token in the `Authorization` header.
    - Public endpoints explicitly declare `security: []`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3000
    description: API service local development server
tags:
  - name: Health
    description: Service health and readiness operations for the API service
  - name: Connections
    description: Composio app connection and authentication management
  - name: Marketplace
    description: Agent publishing, builder fields, and flow execution
  - name: Apps
    description: Pending app wishlist management
  - name: Agents
    description: Agent customization and publishing
  - name: Deprecated
    description: Removed endpoints from the legacy n8n-workflow and inngest-trigger controllers
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get API service health
      description: Returns a simple health response for the AIGravity/core API service.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API service is reachable and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/connections/auth/apps:
    post:
      tags:
        - Connections
      summary: List referenced Composio apps in a workflow
      description: Returns the list of Composio apps referenced in a workflow for the authenticated user.
      operationId: postConnectionsAuthApps
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthAppsDto'
            example:
              workflow:
                nodes: []
      responses:
        '200':
          description: Successfully extracted referenced app identifiers from the workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAppsResponse'
              example:
                apps:
                  - gmail
                  - slack
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/connections/auth/initiate:
    post:
      tags:
        - Connections
      summary: Initiate Composio OAuth connection
      description: Initiates a Composio OAuth connection flow for a given app for the authenticated user.
      operationId: postConnectionsAuthInitiate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInitiateDto'
            example:
              app: gmail
              redirectUrl: https://app.aigravity.dev/connections/callback
      responses:
        '200':
          description: OAuth initiation result, either a redirect payload or an error payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInitiateResponse'
              examples:
                success:
                  value:
                    redirectUrl: https://composio.example/oauth/start
                    connectionStatus: initiated
                error:
                  value:
                    error: Unable to initiate connection
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/connections/auth/status:
    post:
      tags:
        - Connections
      summary: Check Composio connection status
      description: Checks the Composio connection status for a given app for the authenticated user.
      operationId: postConnectionsAuthStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthStatusDto'
            example:
              app: gmail
      responses:
        '200':
          description: Current connection status for the requested app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
              examples:
                connected:
                  value:
                    connected: true
                    connectionId: conn_123
                    status: ACTIVE
                notConnected:
                  value:
                    connected: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/connections/auth/connections:
    get:
      tags:
        - Connections
      summary: List Composio connections
      description: Lists all Composio connections for the authenticated user. Returned statuses are normalized to `connected` or `needs_reconnect`, and transitional states are omitted.
      operationId: getConnectionsAuthConnections
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of normalized connections for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConnectionsResponse'
              examples:
                success:
                  value:
                    connections:
                      - slug: gmail
                        status: connected
                        connectionId: conn_123
                      - slug: hubspot
                        status: needs_reconnect
                        connectionId: conn_456
                emptyOnError:
                  value:
                    connections: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/connections/auth/disconnect:
    post:
      tags:
        - Connections
      summary: Disconnect a Composio app
      description: Disconnects a Composio app connection for the authenticated user.
      operationId: postConnectionsAuthDisconnect
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthStatusDto'
            example:
              app: gmail
      responses:
        '200':
          description: Disconnect result for the requested app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDisconnectResponse'
              examples:
                success:
                  value:
                    disconnected: true
                notFound:
                  value:
                    disconnected: false
                    error: Connection not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/marketplace/builder-fields:
    post:
      tags:
        - Marketplace
      summary: Get marketplace builder fields
      description: Returns builder fields for a published workflow, sourced from consumer inputs, for the authenticated user.
      operationId: postMarketplaceBuilderFields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuilderFieldsDto'
            example:
              agentId: agent_123
      responses:
        '200':
          description: Builder fields resolved for the requested published workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuilderFieldsResponse'
              example:
                fields:
                  - id: field_1
                    engine: ap
                    canonicalName: company_name
                    fieldType: string
                    label: Company Name
                    required: true
                    defaultValue: null
                    pieceName: hubspot
                    pieceVersion: 1.0.0
                    actionName: create_contact
                    propertyName: company
                    refreshers:
                      - workspace_id
                    targets:
                      - nodeName: Create Contact
                        paramPath: input.company
                    staticOptions: null
                    markdownValue: null
                source: ap-consumer-inputs
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/apps/pending/all:
    delete:
      tags:
        - Apps
      summary: Clear all pending apps
      description: Bulk-clears all pending apps in the authenticated user's wishlist.
      operationId: deleteAppsPendingAll
      security:
        - BearerAuth: []
      responses:
        '204':
          description: All pending apps were cleared successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
