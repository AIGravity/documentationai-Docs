        pieceName: hubspot
        pieceVersion: 1.0.0
        actionName: create_contact
        propertyName: company
        refreshers:
          - workspace_id
        targets:
          - nodeName: Create Contact
            paramPath: input.company
        staticOptions: null
        markdownValue: null
