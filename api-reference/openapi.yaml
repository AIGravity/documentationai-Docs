        - id
        - name
        - description
        - steps
        - lastRunAt
      properties:
        id:
          type: string
          example: pub_123
        name:
          type: string
          example: Invoice Reminder Agent
        description:
          type: string
          example: Sends reminder emails for unpaid invoices.
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
            - type: trigger
              name: Schedule
            - type: action
              name: Send Email
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-20T08:00:00Z'
    RunningAutomationRollupDetail:
      type: object
      description: Detailed admin rollup of one running automation.
      required:
        - id
        - name
        - description
        - steps
        - lastRunAt
        - totalRuns
        - reviewNote
      properties:
        id:
          type: string
          example: pub_123
        name:
          type: string
          example: Invoice Reminder Agent
        description:
          type: string
          example: Sends reminder emails for unpaid invoices.
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-20T08:00:00Z'
        totalRuns:
          type: number
          format: double
          example: 42
        reviewNote:
          type: object
          required:
            - kind
            - totalRuns
            - creditsUsed
            - lastRunAt
            - activeUsers
            - pausedUsers
          properties:
            kind:
              type: string
              enum:
                - automation_stats
              example: automation_stats
            totalRuns:
              type: number
              format: double
              example: 42
            creditsUsed:
              type: number
              format: double
              example: 19.5
            lastRunAt:
              type: string
              format: date-time
              example: '2026-01-20T08:00:00Z'
            activeUsers:
              type: number
              format: double
              example: 12
            pausedUsers:
              type: number
              format: double
              example: 3
