  /verification/generate-fillable-fields:
    post:
      tags:
        - AI Verification
      summary: Generate fillable fields
      description: Generates consumer-fillable workflow fields.
      operationId: generateFillableFields
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '502':
          $ref: '#/components/responses/BadGateway'
  /verification/check-setup-fields:
    post:
      tags:
        - AI Verification
      summary: Check setup fields
      description: Validates workflow setup fields.
      operationId: checkSetupFields
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /verification/judge-request-alignment:
    post:
      tags:
        - AI Verification
      summary: Judge request alignment
      description: Determines whether a workflow aligns with a request.
      operationId: judgeRequestAlignment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /verification/prewarm:
    post:
      tags:
        - AI Verification
      summary: Prewarm verification
      description: Prewarms verification resources for a workflow.
      operationId: prewarmVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /verification/verify-ap-stream:
    post:
      tags:
        - AI Verification
      summary: Stream AP verification
      description: Streams verification gate events and the final pass or failure result.
      operationId: verifyApStream
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Verification event stream
          content:
            text/event-stream:
              schema:
                type: string
  /agent-review/analyze:
    post:
      tags:
        - AI Review
      summary: Analyze agent workflow
      description: Reviews an agent workflow evidence graph and returns findings and routing.
      operationId: analyzeAgentWorkflow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewWorkflowRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  parameters:
    Email:
      name: email
      in: query
      required: true
      description: Email address to check
      schema:
        type: string
        format: email
    UserType:
      name: userType
      in: query
      required: true
      description: Account type
      schema:
        type: string
        enum:
          - creator
          - business
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string
    UuidId:
      name: id
      in: path
      required: true
      description: UUID resource identifier
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Submission identifier
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      description: Resource status filter
      schema:
        type: string
        default: pending
    Limit50:
      name: limit
      in: query
      required: false
      description: Maximum number of results
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    Limit200:
      name: limit
      in: query
      required: false
      description: Maximum number of results
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of results to skip
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    GenericSuccess:
      description: Successful request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    ArraySuccess:
      description: Successful request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GenericObject'
    AuthSuccess:
      description: Authentication succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    PayoutSuccess:
      description: Payout request succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayoutResponse'
    Accepted:
      description: Request accepted for asynchronous processing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Semantic validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Upstream provider failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    GenericObject:
      type: object
      description: Generic JSON object returned by an endpoint.
      additionalProperties: true
    GenericRequest:
      type: object
      description: Request object whose fields depend on the operation.
      additionalProperties: true
    HealthResponse:
      type: object
      description: Service health response.
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api
        version:
          type: string
        chat_available:
          type: boolean
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      description: Generic error response.
      required:
        - message
      properties:
        message:
          type: string
          example: Internal server error
        code:
          type: string
    AuthResponse:
      type: object
      description: Authenticated user and token response.
      required:
        - user
        - accessToken
        - refreshToken
      properties:
        user:
          $ref: '#/components/schemas/GenericObject'
        accessToken:
          type: string
        refreshToken:
          type: string
        isNewUser:
          type: boolean
    SignUpDto:
      type: object
      required:
        - email
        - password
        - userType
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        userType:
          type: string
          enum:
            - creator
            - business
        profile:
          type: object
          additionalProperties: true
    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SendOtpDto:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        userType:
          type: string
          enum:
            - creator
            - business
    VerifyOtpDto:
      type: object
      required:
        - email
        - token
        - userType
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        userType:
          type: string
          enum:
            - creator
            - business
    RefreshTokenDto:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    GoogleAuthRequest:
      type: object
      required:
        - userType
      properties:
        code:
          type: string
        idToken:
          type: string
        userType:
          type: string
          enum:
            - creator
            - business
        referralCode:
          type: string
    PublishAgentDto:
      type: object
      required:
        - workflowJson
        - name
      properties:
        workflowJson:
          type: object
          additionalProperties: true
        name:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
    CheckRequestAlignmentDto:
      type: object
      required:
        - workflowJson
      properties:
        workflowJson:
          type: object
          additionalProperties: true
        title:
          type: string
        description:
          type: string
        platforms:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
    ReviewSubmissionDto:
      type: object
      required:
        - workflowJson
      properties:
        workflowJson:
          type: object
          additionalProperties: true
        agentId:
          type: string
        metadata:
          type: object
          additionalProperties: true
    VerifyAgentDto:
      type: object
      required:
        - workflowJson
      properties:
        workflowJson:
          type: object
          additionalProperties: true
        agentId:
          type: string
        request:
          type: object
          additionalProperties: true
    PublishPasteDto:
      type: object
      required:
        - template
        - name
      properties:
        template:
          type: object
          additionalProperties: true
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        inputs:
          type: object
          additionalProperties: true
        existingId:
          type: string
    RunWorkflowDto:
      type: object
      required:
        - publishedWorkflowId
        - input
      properties:
        publishedWorkflowId:
          type: string
          format: uuid
        input:
          type: object
          additionalProperties: true
        fieldValues:
          type: object
          additionalProperties: true
        sessionId:
          type: string
        idempotencyKey:
          type: string
    CreateAutomationDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        workflowJson:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    UpdateAutomationDto:
      type: object
      properties:
        name:
          type: string
        workflowJson:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    CreateBountyDto:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        reward:
          type: number
        currency:
          type: string
    PreviewBountyDto:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
    SubscriptionCheckoutRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
        countryOverride:
          type: string
    SubscriptionResponse:
      type: object
      properties:
        subscriptionId:
          type: string
        plan:
          type: object
          additionalProperties: true
        status:
          type: string
        renewsAt:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
    SubscriptionEntitlement:
      type: object
      additionalProperties: true
      properties:
        active:
          type: boolean
        spendable:
          type: number
        reserved:
          type: number
    CreditOrderRequest:
      type: object
      required:
        - package
        - currency
      properties:
        package:
          type: string
        amount:
          type: number
        currency:
          type: string
        countryOverride:
          type: string
    CreditBalance:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
    PayoutRequest:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        note:
          type: string
        accountId:
          type: string
    PayoutResponse:
      type: object
      properties:
        payout:
          type: object
          additionalProperties: true
    PayoutAccountRequest:
      type: object
      required:
        - country
      properties:
        country:
          type: string
        accountType:
          type: string
        bankAccount:
          type: object
          additionalProperties: true
        upi:
          type: string
        paypalEmail:
          type: string
          format: email
        default:
          type: boolean
    ChatRequest:
      type: object
      required:
        - message
      properties:
        userId:
          type: string
        sessionId:
          type: string
        message:
          type: string
        selectedTools:
          type: array
          items:
            type: string
        submitTools:
          type: array
          items:
            type: string
        agent:
          type: object
          additionalProperties: true
    InteractionResponse:
      type: object
      properties:
        execution_id:
          type: string
        response:
          type: object
          additionalProperties: true
    GuardrailCheckRequest:
      type: object
      required:
        - content
        - source
      properties:
        content:
          type: string
        source:
          type: string
        context:
          type: object
          additionalProperties: true
    GuardrailCheckResponse:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
    EmbedRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
    EmbedResponse:
      type: object
      required:
        - embedding
        - dims
      properties:
        embedding:
          type: array
          items:
            type: number
        dims:
          type: integer
    IndexAgentRequest:
      type: object
      required:
        - agentId
        - template
      properties:
        agentId:
          type: string
        template:
          type: object
          additionalProperties: true
    ReviewWorkflowRequest:
      type: object
      required:
        - evidenceGraph
      properties:
        evidenceGraph:
          type: object
          additionalProperties: true
        stepOutputs:
          type: object
          additionalProperties: true
        brief:
          type: object
          additionalProperties: true
        source:
          type: string
    ReviewWorkflowResponse:
      type: object
      additionalProperties: true
      properties:
        reviewerVersion:
          type: string
        submissionId:
          type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
        counts:
          type: object
          additionalProperties: true
    VerificationRequest:
      type: object
      required:
        - workflowJson
      properties:
        workflowJson:
          type: object
          additionalProperties: true
        field:
          type: string
        user_draft:
          type: string
        name:
          type: string
        description:
          type: string
        problemSolved:
          type: string
        contentHash:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: JWT Bearer token for the NestJS API. Use the value `Bearer <token>`.
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
      description: Administrative token for AI service admin routes.