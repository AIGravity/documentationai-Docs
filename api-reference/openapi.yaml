components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Supabase JWT token
  responses:
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Authentication required. A valid Bearer JWT token must be provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
  schemas:
    HealthResponse:
      type: object
      description: Permissive health response payload for the API service.
      additionalProperties: true
      example:
        status: ok
    Error:
      type: object
      description: Generic error response.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: Internal server error
    AuthAppsDto:
      type: object
      description: Request payload containing a workflow to inspect for referenced Composio apps.
      required:
        - workflow
      properties:
        workflow:
          type: object
          description: Workflow object to inspect for referenced applications.
          additionalProperties: true
      example:
        workflow:
          nodes: []
    AuthInitiateDto:
      type: object
      description: Request payload for initiating a Composio OAuth connection.
      required:
        - app
      properties:
        app:
          type: string
          description: Application slug to connect.
          maxLength: 512
          example: gmail
        redirectUrl:
          type: string
          description: Optional URL to redirect the user after authentication.
          maxLength: 2048
          example: https://app.aigravity.dev/connections/callback
      example:
        app: gmail
        redirectUrl: https://app.aigravity.dev/connections/callback
    AuthStatusDto:
      type: object
      description: Request payload for checking or disconnecting a Composio app connection.
      required:
        - app
      properties:
        app:
          type: string
          description: Application slug to inspect.
          maxLength: 512
          example: gmail
      example:
        app: gmail
    AuthAppsResponse:
      type: object
      description: Referenced Composio apps extracted from a workflow.
      required:
        - apps
      properties:
        apps:
          type: array
          description: List of app slugs referenced in the workflow.
          items:
            type: string
          example:
            - gmail
            - slack
      example:
        apps:
          - gmail
          - slack
    AuthInitiateResponse:
      oneOf:
        - type: object
          description: Successful OAuth initiation response.
          required:
            - redirectUrl
            - connectionStatus
          properties:
            redirectUrl:
              type: string
              description: Redirect URL to continue the OAuth flow.
              example: https://composio.example/oauth/start
            connectionStatus:
              type: string
              description: Current connection state after initiation.
              example: initiated
        - type: object
          description: Error response returned as a successful HTTP response payload.
          required:
            - error
          properties:
            error:
              type: string
              description: Error encountered while initiating authentication.
              example: Unable to initiate connection
      description: Result of initiating a Composio OAuth connection.
    AuthStatusResponse:
      type: object
      description: Connection status for a requested Composio app.
      required:
        - connected
      properties:
        connected:
          type: boolean
          description: Whether the app is currently connected.
          example: true
        connectionId:
          type: string
          description: Connection identifier when connected.
          example: conn_123
        status:
          type: string
          description: Provider connection status when connected.
          example: ACTIVE
      example:
        connected: true
        connectionId: conn_123
        status: ACTIVE
    AuthConnectionsResponse:
      type: object
      description: List of normalized Composio connections for the authenticated user.
      required:
        - connections
      properties:
        connections:
          type: array
          description: User connections with normalized status values.
          items:
            type: object
            required:
              - slug
              - status
              - connectionId
            properties:
              slug:
                type: string
                description: Application slug.
                example: gmail
              status:
                type: string
                description: Normalized connection status.
                enum:
                  - connected
                  - needs_reconnect
                example: connected
              connectionId:
                type: string
                description: Composio connection identifier.
                example: conn_123
      example:
        connections:
          - slug: gmail
