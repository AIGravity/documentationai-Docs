openapi: '3.0.0'
info:
  version: 1.0.0
  title: AIGravity Core API
  description: |
    This specification documents the NestJS API service and FastAPI AI service in the AIGravity core repository.

    The NestJS service provides authentication, agents, marketplace workflows, automations, billing, bounties, chat, connections, payouts, referrals, and telemetry. The FastAPI service provides AI chat, guardrails, embeddings, indexing, verification, and agent review capabilities.

    NestJS endpoints use JWT Bearer authentication where indicated. AI service administrative endpoints use the `x-admin-token` header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3001
    description: NestJS API service (local development)
  - url: http://localhost:8001
    description: FastAPI AI service (local development)
tags:
  - name: Health
    description: Service health and readiness
  - name: Authentication
    description: User signup, login, OTP, OAuth, and session management
  - name: Agents
    description: Agent publishing, verification, review, and administration
  - name: Marketplace
    description: Workflow marketplace, execution, connections, and builder testing
  - name: Automations
    description: User automation CRUD and run history
  - name: Bounties
    description: Bounty creation, submissions, payments, and awards
  - name: Subscriptions
    description: Subscription plans, checkout, entitlement, and history
  - name: Credits
    description: Credit packages, orders, and balance
  - name: Payouts
    description: Builder payout requests and payout accounts
  - name: Chat
    description: Chat sessions and AI messaging
  - name: Connections
    description: Third-party integration connections
  - name: Leaderboard
    description: Public builder and workflow leaderboards
  - name: Telemetry
    description: Client-side loading duration telemetry
  - name: Referrals
    description: Referral links, earnings, and attribution
  - name: AI Core
    description: AI service chat, health, guardrails, embeddings, and indexing
  - name: AI Verification
    description: Agent verification generation, alignment, and streaming
  - name: AI Review
    description: Agent review and analysis
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health
      description: Returns the health of the service represented by the selected server.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: api
                timestamp: '2024-01-01T00:00:00Z'
  /:
    get:
      tags:
        - Health
      summary: Get API root health
      description: Returns the NestJS API root health response.
      operationId: getApiRootHealth
      security: []
      responses:
        '200':
          description: API service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: api
  /api/auth/check-email:
    get:
      tags:
        - Authentication
      summary: Check whether an email exists
      description: Checks whether an email address is associated with an account.
      operationId: checkEmail
      security: []
      parameters:
        - $ref: '#/components/parameters/Email'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Sign up
      description: Creates a user account and profile.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpDto'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a user and returns access and refresh tokens.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/otp/send:
    post:
      tags:
        - Authentication
      summary: Send an OTP
      description: Sends a one-time password to an email address.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpDto'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/otp/verify:
    post:
      tags:
        - Authentication
      summary: Verify an OTP
      description: Verifies an OTP and creates or authenticates the user session.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh tokens
      description: Exchanges a refresh token for a new token pair.
      operationId: refreshAuthTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Invalidates the authenticated session.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns the authenticated user's profile.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request a password reset
      description: Sends a generic password reset response for an email address.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
  /api/auth/update-password:
    post:
      tags:
        - Authentication
      summary: Update password
      description: Updates the authenticated user's password.
      operationId: updatePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/url:
    get:
      tags:
        - Authentication
      summary: Get Google OAuth URL
      description: Returns a Google OAuth redirect URL.
      operationId: getGoogleOAuthUrl
      security: []
      parameters:
        - $ref: '#/components/parameters/UserType'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/google/callback:
    post:
      tags:
        - Authentication
      summary: Complete Google OAuth callback
      description: Exchanges an OAuth authorization code for a user session.
      operationId: handleGoogleCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/id-token:
    post:
      tags:
        - Authentication
      summary: Authenticate with Google ID token
      description: Authenticates a user with a Google ID token.
      operationId: authenticateGoogleIdToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/sync:
    post:
      tags:
        - Authentication
      summary: Synchronize Google profile
      description: Synchronizes the authenticated user's Google profile.
      operationId: syncGoogleProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/agents/publish:
    post:
      tags:
        - Agents
      summary: Publish an agent
      description: Publishes an agent for marketplace use.
      operationId: publishAgent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAgentDto'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/check-request-alignment:
    post:
      tags:
        - Agents
      summary: Check request alignment
      description: Determines whether an agent request aligns with the submitted workflow.
      operationId: checkRequestAlignment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequestAlignmentDto'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/check-duplicate:
    post:
      tags:
        - Agents
      summary: Check for duplicate agent
      description: Checks workflow content for duplicate agents.
      operationId: checkDuplicateAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/mine:
    get:
      tags:
        - Agents
      summary: List owned agents
      description: Returns agents owned by the authenticated user.
      operationId: listOwnedAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ArraySuccess'
  /api/agents/mine/{id}:
    get:
      tags:
        - Agents
      summary: Get owned agent
      description: Returns details for an owned agent.
      operationId: getOwnedAgent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Agents
      summary: Delete owned agent
      description: Deletes an owned agent.
      operationId: deleteOwnedAgent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/preview-description:
    post:
      tags:
        - Agents
      summary: Preview agent description
      description: Generates a description preview from workflow data.
      operationId: previewAgentDescription
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/preview-workflow-steps:
    post:
      tags:
        - Agents
      summary: Preview workflow steps
      description: Generates workflow step descriptions.
      operationId: previewWorkflowSteps
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/preview-categories:
    post:
      tags:
        - Agents
      summary: Preview agent categories
      description: Generates categories for a workflow.
      operationId: previewAgentCategories
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/validate-setup:
    post:
      tags:
        - Agents
      summary: Validate agent setup
      description: Validates required agent setup fields.
      operationId: validateAgentSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/review-submission:
    post:
      tags:
        - Agents
      summary: Submit an agent for review
      description: Creates a pending agent review submission.
      operationId: submitAgentReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionDto'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/review-submissions/mine:
    get:
      tags:
        - Agents
      summary: List own review submissions
      description: Returns pending and rejected review submissions for the user.
      operationId: listOwnReviewSubmissions
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ArraySuccess'
  /api/agents/review-submissions/mine/{id}:
    get:
      tags:
        - Agents
      summary: Get own review submission
      description: Returns a review submission and its details.
      operationId: getOwnReviewSubmission
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/review-submissions/mine/{id}/feedback:
    post:
      tags:
        - Agents
      summary: Save review feedback
      description: Saves feedback for a review finding.
      operationId: saveReviewFeedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/agents/admin/pending-reviews:
    get:
      tags:
        - Agents
      summary: List pending reviews
      description: Returns pending agent review cards for administrators.
      operationId: listPendingAgentReviews
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          $ref: '#/components/responses/ArraySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/admin/published:
    get:
      tags:
        - Agents
      summary: List published agents
      description: Returns published agents for administrators.
      operationId: listPublishedAgents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ArraySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/admin/running-automations:
    get:
      tags:
        - Agents
      summary: List running automations
      description: Returns running automation rollups for administrators.
      operationId: listRunningAutomations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ArraySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/admin/pending-reviews/{id}:
    get:
      tags:
        - Agents
      summary: Get pending review
      description: Returns a full pending review for administrators.
      operationId: getPendingReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/builder-report/draft:
    get:
      tags:
        - Agents
      summary: Get builder report draft
      description: Returns a draft builder report.
      operationId: getBuilderReportDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/re-review:
    post:
      tags:
        - Agents
      summary: Re-queue a review
      description: Re-queues a pending review for analysis.
      operationId: reReviewAgent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/builder-report/send:
    post:
      tags:
        - Agents
      summary: Send builder report
      description: Sends or rejects a builder report.
      operationId: sendBuilderReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/approve:
    post:
      tags:
        - Agents
      summary: Approve agent review
      description: Approves and publishes an agent.
      operationId: approveAgentReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/reject:
    post:
      tags:
        - Agents
      summary: Reject agent review
      description: Rejects a pending agent review.
      operationId: rejectAgentReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/test-run/prepare:
    post:
      tags:
        - Agents
      summary: Prepare review test run
      description: Prepares a test-run workspace for a pending review.
      operationId: prepareReviewTestRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/test-run:
    post:
      tags:
        - Agents
      summary: Run review test
      description: Runs a prepared pending-review test.
      operationId: runReviewTest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/admin/pending-reviews/{id}/test-run/result:
    post:
      tags:
        - Agents
      summary: Poll review test result
      description: Re-polls the result of a review test.
      operationId: pollReviewTestResult
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/preview-fillable-fields:
    post:
      tags:
        - Agents
      summary: Preview fillable fields
      description: Returns fields that can be filled by a workflow consumer.
      operationId: previewFillableFields
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /api/agents/verify-stream:
    post:
      tags:
        - Agents
      summary: Stream agent verification
      description: Streams verification gate events and the final verification result.
      operationId: verifyAgentStream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAgentDto'
      responses:
        '200':
          description: Verification event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/agents/verify-warmup:
    post:
      tags:
        - Agents
      summary: Warm up verification
      description: Starts verification service warmup.
      operationId: warmupAgentVerification
      security:
