      required:
        - id
        - engine
        - canonicalName
        - fieldType
        - label
        - required
        - pieceName
        - pieceVersion
        - actionName
        - propertyName
        - refreshers
        - targets
      properties:
        id:
          type: string
          description: Unique field identifier.
          example: field_1
        engine:
          type: string
          description: Source engine for the field.
          example: ap
        canonicalName:
          type: string
          description: Canonical field name.
          example: company_name
        fieldType:
          type: string
          description: Field type identifier.
          example: string
        label:
          type: string
          description: Human-readable field label.
          example: Company Name
        required:
          type: boolean
          description: Whether the field is required.
          example: true
        defaultValue:
          nullable: true
          description: Default field value when present.
        pieceName:
          type: string
          description: Source piece name.
          example: hubspot
        pieceVersion:
          type: string
          description: Source piece version.
          example: 1.0.0
        actionName:
          type: string
          description: Source action name.
          example: create_contact
        propertyName:
          type: string
          description: Source property name.
          example: company
        refreshers:
          type: array
          description: Names of fields that refresh this field.
          items:
            type: string
          example:
