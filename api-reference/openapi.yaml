                      - true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request is syntactically valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Payment or sufficient account credits are required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user is not permitted to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Upstream service returned an invalid response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Current service status.
          example: ok
        service:
          type: string
          description: Service identifier.
          example: api
        timestamp:
          type: string
          format: date-time
          description: Time at which the health response was generated.
    Error:
      type: object
      required:
        - statusCode
        - error
        - message
        - path
        - timestamp
      properties:
        statusCode:
          type: integer
          format: int32
          description: HTTP status code.
        error:
          type: string
          description: Short error name.
        message:
          type: string
          description: Human-readable error message.
        path:
          type: string
          description: Request path that generated the error.
        timestamp:
          type: string
          format: date-time
          description: Time at which the error occurred.
        requestId:
          type: string
          description: Optional identifier for tracing the request.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          type: object
          additionalProperties: true
        session:
          type: object
          required:
            - accessToken
            - refreshToken
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
    SignupRequest:
      type: object
      required:
        - email
        - password
        - userType
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        userType:
          type: string
          enum:
            - creator
            - business
    ChatMessageRequest:
      type: object
      required:
        - message
        - session
      properties:
        message:
          type: string
        session:
          type: object
          additionalProperties: true
        user:
          type: object
          additionalProperties: true
    MarketplaceRunRequest:
      type: object
      required:
        - publishedWorkflowId
        - input
      properties:
        publishedWorkflowId:
          type: string
        input:
          type: object
          additionalProperties: true
        fieldValues:
          type: object
          additionalProperties: true
        sessionId:
          type: string
    MarketplaceRunResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - needs-connections
            - running
            - paused
            - succeeded
            - failure
        runId:
          type: string
    BuilderFeedbackRequest:
      type: object
      required:
        - findingId
        - verdict
      properties:
        findingId:
          type: string
        verdict:
          type: string
          enum:
            - up
            - down
        note:
          type: string
    BuilderReportSendRequest:
      type: object
      required:
        - keepIds
      properties:
        keepIds:
          type: array
          items:
            type: string
        edits:
          type: object
          description: Edits restricted to severity, title, and message.
          additionalProperties: true
        reason:
          type: string
          maxLength: 2000
    BountiesCreateRequest:
      type: object
      required:
        - title
        - description
        - amount
        - currency
        - session
      properties:
        title:
          type: string
        description:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        session:
          type: object
          additionalProperties: true
    PayoutCreateRequest:
      type: object
      required:
        - amount
        - currency
        - accountId
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
        note:
          type: string
        accountId:
          type: string
    CreditsOrderRequest:
      type: object
      required:
        - packageId
        - currency
      properties:
        packageId:
          type: string
        currency:
          type: string
        countryOverride:
          type: string
    SubscriptionCheckoutRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
        countryOverride:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT