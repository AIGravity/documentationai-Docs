openapi: '3.0.0'
info:
  version: 1.0.0
  title: AIGravity Core API Service
  description: |
    This specification documents both the NestJS API service in `apps/api` and the FastAPI AI service in `apps/ai-service`.

    The NestJS API service provides health endpoints. The AI service provides health, chat, administrative pricing, and internal guardrail operations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3001
    description: API service local development server
  - url: http://localhost:8000
    description: AI service local development server
tags:
  - name: Health
    description: Service health and readiness operations
  - name: Chat
    description: AI chat interaction endpoints
  - name: Admin
    description: Admin-only AI service operations
  - name: Guardrail
    description: Internal guardrail check endpoints
paths:
  /:
    get:
      tags:
        - Health
      summary: Root health check
      description: Returns a minimal health response confirming the API service is running.
      operationId: getRoot
      security: []
      responses:
        '200':
          description: API service is reachable and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseRoot'
              example:
                status: ok
                service: api
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags:
        - Health
      summary: Get API service health with timestamp
      description: Returns the service health status and the current server timestamp. On the AI service server, this endpoint returns the AI service health status, service name, version, and chat availability.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HealthResponseTimestamp'
                  - $ref: '#/components/schemas/AiHealthResponse'
              examples:
                api:
                  value:
                    status: ok
                    service: api
                    timestamp: '2026-09-21T12:34:56.789Z'
                ai:
                  value:
                    status: healthy
                    service: Gravity AI Interaction Layer
                    version: 1.0.0
                    chat_available: true
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat:
    post:
      tags:
        - Chat
      summary: Send a chat message
      description: Processes a user message through the AI interaction layer and returns a structured response with reply text, conversation metadata, and agent suggestions.
      operationId: sendChatMessage
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Structured AI interaction response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
              example:
                session_id: '22222222-2222-2222-2222-222222222222'
                reply: I found several email automation agents.
                question: ''
                options: []
                mode: general_help
                info_json: {}
                ready_to_query: true
                search_query: email automation agent
                memories: []
                guardrail_log: Passed
                redis_history: []
                typesense_payload: {}
                top_agents: []
                suggested_tools:
                  - gmail
                show_tool_selection: false
                llm_calls: 1
                execution_id: null
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Chat service unavailable — no LLM API key configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Chat service unavailable — no LLM API key configured
  /admin/pricing:
    post:
      tags:
        - Admin
      summary: Override model pricing
      description: Applies a pricing override for a specific provider and model. Requires the x-admin-token header to match the server's ADMIN_API_TOKEN environment variable.
      operationId: overridePricing
      security: []
      parameters:
        - name: x-admin-token
          in: header
          required: true
          description: Admin authentication token matching the ADMIN_API_TOKEN environment variable
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingOverrideRequest'
      responses:
        '200':
          description: Pricing override applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingOverrideResponse'
              example:
                message: Pricing override successful
                model: openai/gpt-4o
                version: 1
        '403':
          description: Admin token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Admin token required
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/guardrail/check:
    post:
      tags:
        - Guardrail
      summary: Check content against guardrails
      description: Evaluates text content against configured guardrails (e.g., AWS Bedrock) and returns whether the content is safe, along with the reason and tier.
      operationId: guardrailCheck
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailCheckRequest'
      responses:
        '200':
          description: Guardrail evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
              example:
                safe: true
                reason: Passed
                tier: bedrock
                output: null
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  responses:
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              - loc:
                  - body
                  - user_id
                msg: Field required
                type: missing
  schemas:
    HealthResponseRoot:
      type: object
      description: Root health response from the NestJS API service.
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Health state
          example: ok
        service:
          type: string
          description: Service identifier
          example: api
    HealthResponseTimestamp:
      type: object
      description: Health response with timestamp from the NestJS API service.
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          description: Health state
          example: ok
        service:
          type: string
          description: Service identifier
          example: api
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp generated at request time
          example: '2026-09-21T12:34:56.789Z'
    AiHealthResponse:
      type: object
      description: Health response from the AI service.
      required:
        - status
        - service
        - version
        - chat_available
      properties:
        status:
          type: string
          description: Health state
          example: healthy
        service:
          type: string
          description: Service name
          example: Gravity AI Interaction Layer
        version:
          type: string
          description: Service version
          example: 1.0.0
        chat_available:
          type: boolean
          description: Whether the chat LLM service is initialized and available
          example: true
    ChatRequest:
      type: object
      description: Request body for the AI chat endpoint.
      required:
        - user_id
        - session_id
        - message
      properties:
        user_id:
          type: string
          format: uuid
          description: User identifier
          example: 11111111-1111-1111-1111-111111111111
        session_id:
          type: string
          format: uuid
          description: Session identifier
          example: 22222222-2222-2222-2222-222222222222
        message:
          type: string
          description: User message text (0–4000 characters)
          minLength: 0
          maxLength: 4000
          example: Find me an email automation agent
        selected_tools:
          type: array
          description: Pre-selected tool slugs
          items:
            type: string
          default: []
          example:
            - gmail
        submit_tools:
          type: boolean
          description: Whether to submit the selected tools
          default: false
        agent_id:
          type: string
          nullable: true
          description: Optional agent identifier
          default: null
    InteractionResponse:
      type: object
      description: Response from the AI chat endpoint.
      required:
        - session_id
        - reply
        - info_json
        - ready_to_query
        - search_query
        - memories
        - guardrail_log
        - redis_history
        - typesense_payload
        - top_agents
        - suggested_tools
      properties:
        session_id:
          type: string
          description: Session identifier
        reply:
          type: string
          description: Generated reply text
        question:
          type: string
          description: Follow-up question text
          default: ''
        options:
          type: array
          description: Selectable options presented to the user
          items:
            type: string
          default: []
        mode:
          type: string
          description: Interaction mode (e.g., general_help, clarify, handoff)
          default: ''
        info_json:
          type: object
          description: Structured conversation metadata (handoff flag, agent type, platforms, tools, use case, constraints, preferences, search query)
          additionalProperties: true
        ready_to_query:
          type: boolean
          description: Whether the interaction is ready for query execution
        search_query:
          type: string
          description: Generated search query
        memories:
          type: array
          description: Retrieved memory entries
          items:
            type: string
        guardrail_log:
          type: string
          description: Guardrail evaluation log
        redis_history:
          type: array
          description: Redis conversation history
          items:
            type: object
            additionalProperties: true
        typesense_payload:
          type: object
          description: Typesense search payload
          additionalProperties: true
        top_agents:
          type: array
          description: Top suggested agents
          items:
            type: object
            additionalProperties: true
        suggested_tools:
          type: array
          description: Suggested tools for the user
          items:
            type: string
        show_tool_selection:
          type: boolean
          description: Whether to show the tool selection UI
          default: false
        llm_calls:
          type: integer
          description: Number of LLM API calls made
          default: 0
        execution_id:
          type: string
          nullable: true
          description: Execution identifier for this interaction
          default: null
    PricingOverrideRequest:
      type: object
      description: Request body for the admin pricing override endpoint.
      required:
        - provider
        - model_name
      properties:
        provider:
          type: string
          description: LLM provider name
          example: openai
        model_name:
          type: string
          description: Model name
          example: gpt-4o
        input_cost_per_1k:
          type: number
          nullable: true
          description: Input cost per 1K tokens
          default: null
        output_cost_per_1k:
          type: number
          nullable: true
          description: Output cost per 1K tokens
          default: null
        input_cost_per_million:
          type: number
          nullable: true
          description: Input cost per million tokens
          default: null
        output_cost_per_million:
          type: number
          nullable: true
          description: Output cost per million tokens
          default: null
        source:
          type: string
          description: Source label for the override
          default: admin_override
    PricingOverrideResponse:
      type: object
      description: Response from the admin pricing override endpoint.
      required:
        - message
        - model
        - version
      properties:
        message:
          type: string
          description: Success message
          example: Pricing override successful
        model:
          type: string
          description: Model name that was updated
          example: openai/gpt-4o
        version:
          type: integer
          description: Version number of the active pricing row
          example: 1
    GuardrailCheckRequest:
      type: object
      description: Request body for the internal guardrail check endpoint.
      required:
        - content
      properties:
        content:
          type: string
          description: Text content to evaluate
          example: Text to check
        source:
          type: string
          description: Source of the content (INPUT or OUTPUT)
          enum:
            - INPUT
            - OUTPUT
          default: INPUT
        context:
          type: object
          nullable: true
          description: Optional context metadata
          additionalProperties: true
          default: null
    GuardrailCheckResponse:
      type: object
      description: Response from the guardrail check endpoint.
      required:
        - safe
        - reason
        - tier
      properties:
        safe:
          type: boolean
          description: Whether the content passed guardrail checks
          example: true
        reason:
          type: string
          description: Human-readable reason for the verdict
          example: Passed
        tier:
          type: string
          description: Guardrail tier that produced the verdict (passthrough, bedrock, system, system_error)
          example: bedrock
        output:
          type: string
          nullable: true
          description: Intervening output when blocked; null otherwise
          default: null
    Error:
      type: object
      description: Generic error response.
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: Internal server error
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                required:
                  - loc
                  - msg
                  - type
                properties:
                  loc:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  msg:
                    type: string
                  type:
                    type: string
          description: FastAPI error detail or validation errors.