openapi: '3.0.0'
info:
  version: 2.0.0
  title: AIGravity Core API
  description: |
    API specification for the AIGravity core monorepo covering the NestJS API service and the FastAPI AI service.

    Public health endpoints are available without authentication. Other authenticated operations use bearer token authentication where applicable.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3001
    description: NestJS API service
  - url: http://localhost:8001
    description: AI service
tags:
  - name: Health
    description: Service health and readiness operations
  - name: Authentication
    description: User authentication and account operations
  - name: Chat
    description: Chat and conversation operations
  - name: Apps
    description: Application and integration operations
  - name: Connections
    description: Connection authentication operations
  - name: Builder
    description: Workflow builder operations
  - name: Agents
    description: Agent management operations
  - name: Admin
    description: Administrative operations
  - name: Marketplace
    description: Marketplace operations
  - name: Automations
    description: Automation management operations
  - name: Bounties
    description: Bounty management operations
paths:
  /:
    get:
      tags:
        - Health
      description: Returns the API service status.
      operationId: getRootHealth
      security: []
      responses:
        '200':
          description: API service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health:
    get:
      tags:
        - Health
      description: Returns the API service health status and timestamp.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthTimestampResponse'
  /api/auth/register:
    post:
      tags:
        - Authentication
      description: Registers a new user account.
      operationId: registerUser
      security: []
      responses:
        '201':
          description: User registered
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags:
        - Authentication
      description: Authenticates a user and creates a session.
      operationId: loginUser
      security: []
      responses:
        '200':
          description: User authenticated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      description: Ends the current user session.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      description: Refreshes an authentication session.
      operationId: refreshAuthSession
      security: []
      responses:
        '200':
          description: Session refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/verify-email:
    post:
      tags:
        - Authentication
      description: Verifies a user's email address.
      operationId: verifyEmail
      security: []
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/resend-verification:
    post:
      tags:
        - Authentication
      description: Resends an email verification message.
      operationId: resendEmailVerification
      security: []
      responses:
        '200':
          description: Verification message sent
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      description: Requests a password reset.
      operationId: requestPasswordReset
      security: []
      responses:
        '200':
          description: Password reset requested
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      description: Resets a user's password.
      operationId: resetPassword
      security: []
      responses:
        '200':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/me:
    get:
      tags:
        - Authentication
      description: Returns the authenticated user.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/profile:
    patch:
      tags:
        - Authentication
      description: Updates the authenticated user's profile.
      operationId: updateUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/change-password:
    post:
      tags:
        - Authentication
      description: Changes the authenticated user's password.
      operationId: changePassword
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google:
    get:
      tags:
        - Authentication
      description: Starts Google authentication.
      operationId: startGoogleAuthentication
      security: []
      responses:
        '302':
          description: Redirect to Google
  /api/auth/github:
    get:
      tags:
        - Authentication
      description: Starts GitHub authentication.
      operationId: startGithubAuthentication
      security: []
      responses:
        '302':
          description: Redirect to GitHub
  /api/auth/callback:
    get:
      tags:
        - Authentication
      description: Handles an OAuth authentication callback.
      operationId: handleAuthCallback
      security: []
      responses:
        '302':
          description: Authentication callback handled
  /api/auth/sessions:
    get:
      tags:
        - Authentication
      description: Lists the authenticated user's sessions.
      operationId: listAuthSessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessions listed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/{id}:
    delete:
      tags:
        - Authentication
      description: Revokes an authentication session.
      operationId: revokeAuthSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session identifier.
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/onboarding:
    post:
      tags:
        - Authentication
      description: Completes authenticated user onboarding.
      operationId: completeOnboarding
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding completed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/deactivate:
    post:
      tags:
        - Authentication
      description: Deactivates the authenticated user's account.
      operationId: deactivateAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/chat:
    post:
      tags:
        - Chat
      description: Creates a chat message.
      operationId: createChatMessage
      security: []
      responses:
        '200':
          description: Chat message created
  /api/chat/stream:
    post:
      tags:
        - Chat
      description: Streams a chat response.
      operationId: streamChatResponse
      security: []
      responses:
        '200':
          description: Chat response stream
  /api/chat/sessions:
    get:
      tags:
        - Chat
      description: Lists chat sessions.
      operationId: listChatSessions
      security: []
      responses:
        '200':
          description: Chat sessions
  /api/chat/sessions/{id}:
    get:
      tags:
        - Chat
      description: Returns a chat session.
      operationId: getChatSession
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Chat session identifier.
          schema:
            type: string
      responses:
        '200':
          description: Chat session
        '404':
          $ref: '#/components/responses/NotFound'
  /api/chat/sessions/{id}/messages:
    get:
      tags:
        - Chat
      description: Lists messages in a chat session.
      operationId: listChatMessages
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Chat session identifier.
          schema:
            type: string
      responses:
        '200':
          description: Chat messages
  /api/chat/sessions/{id}/title:
    patch:
      tags:
        - Chat
      description: Updates a chat session title.
      operationId: updateChatSessionTitle
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Chat session identifier.
          schema:
            type: string
      responses:
        '200':
          description: Chat title updated
  /api/chat/feedback:
    post:
      tags:
        - Chat
      description: Submits feedback for a chat response.
      operationId: submitChatFeedback
      security: []
      responses:
        '200':
          description: Feedback submitted
  /api/chat/cancel:
    post:
      tags:
        - Chat
      description: Cancels an active chat response.
      operationId: cancelChatResponse
      security: []
      responses:
        '200':
          description: Chat response cancelled
  /api/apps:
    get:
      tags:
        - Apps
      description: Lists available apps.
      operationId: listApps
      responses:
        '200':
          description: Apps listed
    post:
      tags:
        - Apps
      description: Creates an app.
      operationId: createApp
      responses:
        '201':
          description: App created
  /api/apps/{id}:
    get:
      tags:
        - Apps
      description: Returns an app.
      operationId: getApp
      parameters:
        - name: id
          in: path
          required: true
          description: App identifier.
          schema:
            type: string
      responses:
        '200':
          description: App details
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Apps
      description: Updates an app.
      operationId: updateApp
      parameters:
        - name: id
          in: path
          required: true
          description: App identifier.
          schema:
            type: string
      responses:
        '200':
          description: App updated
    delete:
      tags:
        - Apps
      description: Deletes an app.
      operationId: deleteApp
      parameters:
        - name: id
          in: path
          required: true
          description: App identifier.
          schema:
            type: string
      responses:
        '204':
          description: App deleted
  /api/apps/install:
    post:
      tags:
        - Apps
      description: Installs an app.
      operationId: installApp
      responses:
        '200':
          description: App installed
  /api/apps/uninstall:
    post:
      tags:
        - Apps
      description: Uninstalls an app.
      operationId: uninstallApp
      responses:
        '200':
          description: App uninstalled
  /api/apps/sync:
    post:
      tags:
        - Apps
      description: Synchronizes app metadata.
      operationId: syncApps
      responses:
        '200':
          description: Apps synchronized
  /api/apps/catalog:
    get:
      tags:
        - Apps
      description: Returns the app catalog.
      operationId: getAppCatalog
      responses:
        '200':
          description: App catalog
  /api/activepieces/ensure-session:
    post:
      tags:
        - Apps
      description: Ensures an Activepieces session exists.
      operationId: ensureActivepiecesSession
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Activepieces session
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - projectId
                  - tokenType
                properties:
                  token:
                    type: string
                  projectId:
                    type: string
                  tokenType:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/connections/auth:
    get:
      tags:
        - Connections
      description: Lists connection authentication methods.
      operationId: listConnectionAuthMethods
      responses:
        '200':
          description: Connection authentication methods
  /api/connections/auth/start:
    post:
      tags:
        - Connections
      description: Starts connection authentication.
      operationId: startConnectionAuth
      responses:
        '200':
          description: Connection authentication started
  /api/connections/auth/callback:
    get:
      tags:
        - Connections
      description: Handles a connection authentication callback.
      operationId: handleConnectionAuthCallback
      responses:
        '302':
          description: Connection authentication completed
  /api/connections/auth/complete:
    post:
      tags:
        - Connections
      description: Completes connection authentication.
      operationId: completeConnectionAuth
      responses:
        '200':
          description: Connection authenticated
  /api/connections/auth/revoke:
    post:
      tags:
        - Connections
      description: Revokes connection authentication.
      operationId: revokeConnectionAuth
      responses:
        '200':
          description: Connection authentication revoked
  /api/builder:
    get:
      tags:
        - Builder
      description: Returns builder metadata.
      operationId: getBuilderMetadata
      responses:
        '200':
          description: Builder metadata
  /api/builder/validate:
    post:
      tags:
        - Builder
      description: Validates a builder workflow.
      operationId: validateBuilderWorkflow
      responses:
        '200':
          description: Workflow validation result
  /api/builder/execute:
    post:
      tags:
        - Builder
      description: Executes a builder workflow.
      operationId: executeBuilderWorkflow
      responses:
        '200':
          description: Workflow execution result
  /api/builder/connections:
    get:
      tags:
        - Builder
      description: Lists builder connections.
      operationId: listBuilderConnections
      responses:
        '200':
          description: Builder connections
  /api/builder/connections/available:
    get:
      tags:
        - Builder
      description: Lists available builder connections.
      operationId: listAvailableBuilderConnections
      responses:
        '200':
          description: Available builder connections
  /api/builder/connections/test:
    post:
      tags:
        - Builder
      description: Tests a builder connection.
      operationId: testBuilderConnection
      responses:
        '200':
          description: Connection test result
  /api/builder/connections/{id}:
    delete:
      tags:
        - Builder
      description: Deletes a builder connection.
      operationId: deleteBuilderConnection
      parameters:
        - name: id
          in: path
          required: true
          description: Connection identifier.
          schema:
            type: string
      responses:
        '204':
          description: Builder connection deleted
  /api/builders:
    get:
      tags:
        - Builder
      description: Lists builder profiles.
      operationId: listBuilderProfiles
      responses:
        '200':
          description: Builder profiles
  /api/builders/{id}:
    get:
      tags:
        - Builder
      description: Returns a builder profile.
      operationId: getBuilderProfile
      parameters:
        - name: id
          in: path
          required: true
          description: Builder profile identifier.
          schema:
            type: string
      responses:
        '200':
          description: Builder profile
  /api/builders/{id}/publish:
    post:
      tags:
        - Builder
      description: Publishes a builder profile.
      operationId: publishBuilderProfile
      parameters:
        - name: id
          in: path
          required: true
          description: Builder profile identifier.
          schema:
            type: string
      responses:
        '200':
          description: Builder profile published
  /api/agents:
    get:
      tags:
        - Agents
      description: Lists agents.
      operationId: listAgents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Agents listed
    post:
      tags:
        - Agents
      description: Creates an agent.
      operationId: createAgent
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Agent created
  /api/agents/{id}:
    get:
      tags:
        - Agents
      description: Returns an agent.
      operationId: getAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent details
    patch:
      tags:
        - Agents
      description: Updates an agent.
      operationId: updateAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent updated
    delete:
      tags:
        - Agents
      description: Deletes an agent.
      operationId: deleteAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '204':
          description: Agent deleted
  /api/agents/{id}/runs:
    get:
      tags:
        - Agents
      description: Lists agent runs.
      operationId: listAgentRuns
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent runs
  /api/agents/{id}/run:
    post:
      tags:
        - Agents
      description: Runs an agent.
      operationId: runAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent run started
  /api/agents/{id}/publish:
    post:
      tags:
        - Agents
      description: Publishes an agent.
      operationId: publishAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent published
  /api/agents/{id}/duplicate:
    post:
      tags:
        - Agents
      description: Duplicates an agent.
      operationId: duplicateAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '201':
          description: Agent duplicated
  /api/agents/{id}/archive:
    post:
      tags:
        - Agents
      description: Archives an agent.
      operationId: archiveAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent archived
  /api/agents/{id}/restore:
    post:
      tags:
        - Agents
      description: Restores an archived agent.
      operationId: restoreAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent restored
  /api/agents/{id}/tools:
    get:
      tags:
        - Agents
      description: Lists tools configured for an agent.
      operationId: listAgentTools
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent tools
  /api/agents/{id}/tools/{toolId}:
    delete:
      tags:
        - Agents
      description: Removes a tool from an agent.
      operationId: removeAgentTool
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
        - name: toolId
          in: path
          required: true
          description: Tool identifier.
          schema:
            type: string
      responses:
        '204':
          description: Agent tool removed
  /api/agents/{id}/versions:
    get:
      tags:
        - Agents
      description: Lists versions of an agent.
      operationId: listAgentVersions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent versions
  /api/agents/{id}/versions/{versionId}:
    get:
      tags:
        - Agents
      description: Returns an agent version.
      operationId: getAgentVersion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: Version identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent version
  /api/agents/{id}/test:
    post:
      tags:
        - Agents
      description: Tests an agent.
      operationId: testAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent test result
  /api/agents/{id}/feedback:
    post:
      tags:
        - Agents
      description: Submits agent feedback.
      operationId: submitAgentFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent feedback submitted
  /api/agents/{id}/export:
    get:
      tags:
        - Agents
      description: Exports an agent.
      operationId: exportAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent export
  /api/agents/{id}/import:
    post:
      tags:
        - Agents
      description: Imports agent configuration.
      operationId: importAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent imported
  /api/agents/{id}/share:
    post:
      tags:
        - Agents
      description: Shares an agent.
      operationId: shareAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent shared
  /api/agents/{id}/unshare:
    post:
      tags:
        - Agents
      description: Removes agent sharing.
      operationId: unshareAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent unshared
  /api/agents/{id}/logs:
    get:
      tags:
        - Agents
      description: Lists agent logs.
      operationId: listAgentLogs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent logs
  /api/agents/{id}/schedule:
    post:
      tags:
        - Agents
      description: Schedules an agent.
      operationId: scheduleAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Agent scheduled
  /api/agents/admin:
    get:
      tags:
        - Admin
      description: Lists agents for administrative users.
      operationId: adminListAgents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Administrative agent list
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/admin/{id}:
    get:
      tags:
        - Admin
      description: Returns an agent for administrative users.
      operationId: adminGetAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent identifier.
          schema:
            type: string
      responses:
        '200':
          description: Administrative agent details
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/admin/{id}/approve:
    post:
      tags:
        - Admin
      description: Approves an agent.
