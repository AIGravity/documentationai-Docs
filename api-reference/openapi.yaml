  /api/apps/connections:
    delete:
      tags:
        - Apps
      summary: Delete an app connection
      description: Deletes an app connection for the authenticated caller and returns agents that were auto-paused because they depended on the deleted connection.
      operationId: deleteAppConnection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pieceName
                - externalId
              properties:
                pieceName:
                  type: string
                  description: Activepieces piece name for the connection.
                  example: '@activepieces/piece-slack'
                externalId:
                  type: string
                  description: External connection identifier.
                  example: conn_123
            example:
              pieceName: '@activepieces/piece-slack'
              externalId: conn_123
      responses:
        '200':
          description: Connection deleted and dependent agents paused if necessary
          content:
            application/json:
              schema:
                type: object
                required:
                  - pausedAgents
                properties:
                  pausedAgents:
                    type: array
                    items:
