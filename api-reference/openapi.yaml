                          type: string
                          example: Slack Follow-up Agent
                example:
                  pausedAgents:
                    - id: agt_123
                      name: Slack Follow-up Agent
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/marketplace/run-result:
    post:
      tags:
        - Marketplace
      summary: Retrieve or settle a marketplace run result
      description: Retrieves a marketplace run result and optionally settles it. `gravityRunId` is optional; when absent, settlement is skipped. `startedAfter` is an ISO 8601 recency fallback guard for reattach.
      operationId: getMarketplaceRunResult
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gravityRunId:
                  type: string
                  description: Internal gravity run ID. Optional; settlement is skipped when absent.
                  example: grun_123
                apRunId:
                  type: string
                  description: Activepieces run ID.
                  example: ap_run_123
                startedAfter:
                  type: string
                  format: date-time
                  description: ISO 8601 datetime used as a recency fallback guard for reattach.
                  example: '2026-01-20T09:00:00Z'
            example:
              gravityRunId: grun_123
              apRunId: ap_run_123
              startedAfter: '2026-01-20T09:00:00Z'
      responses:
        '200':
          description: Marketplace run result retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - settled
                properties:
                  result:
                    type: object
                    additionalProperties: true
                    description: Marketplace run result payload.
                    example:
                      status: succeeded
                      output:
                        recordsProcessed: 12
                  settled:
                    type: boolean
                    example: true
              example:
                result:
                  status: succeeded
                  output:
                    recordsProcessed: 12
                settled: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/marketplace/execute:
    post:
      tags:
        - Marketplace
      summary: Execute a marketplace agent
      description: Executes a marketplace agent for the authenticated caller. The server may read the `Referer` header to determine return routing for OAuth flows.
      operationId: executeMarketplaceAgent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agentId
                - inputs
                - consumerInputs
              properties:
                agentId:
                  type: string
                  description: Marketplace agent ID to execute.
                  example: agt_market_123
                inputs:
                  type: array
                  description: Agent execution inputs.
                  items:
                    type: object
                    additionalProperties: true
                  example:
                    - name: company
                      value: AIGravity
                consumerInputs:
                  type: array
                  description: End-user supplied inputs.
                  items:
                    type: object
                    additionalProperties: true
                  example:
                    - name: email
                      value: user@example.com
            example:
              agentId: agt_market_123
              inputs:
                - name: company
                  value: AIGravity
              consumerInputs:
                - name: email
                  value: user@example.com
      responses:
        '200':
          description: Marketplace agent execution started
          content:
            application/json:
              schema:
                type: object
                required:
                  - runId
                  - status
                properties:
                  runId:
                    type: string
                    example: run_123
                  status:
                    type: string
                    example: started
              example:
                runId: run_123
                status: started
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/leaderboard/builders:
    get:
      tags:
        - Leaderboard
      summary: Get public builder leaderboard
      description: Returns the public builder leaderboard. This endpoint does not require authentication.
      operationId: listBuilderLeaderboard
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of builders to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
            example: 100
      responses:
        '200':
          description: Builder leaderboard returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuilderLeaderboardRow'
              example:
                - builderId: bld_123
                  builderName: Alex Builder
                  rank: 1
                  totalEarnings: 1245.5
                  agentsPublished: 8
        '500':
          $ref: '#/components/responses/InternalServerError'
  /internal/agents/{agent_id}:
    delete:
      tags:
        - AI Service Internal
      summary: Delete an agent from the AI service index
      description: Deletes an agent document from the AI service Typesense search index. This is an internal endpoint and does not require authentication. On failure, the error is returned in the response payload and upstream callers may log the error without rolling back.
      operationId: deleteInternalAgentFromIndex
      security: []
      parameters:
        - name: agent_id
          in: path
          description: Agent identifier to delete from the AI service search index.
          required: true
          schema:
            type: string
            example: agt_123
      responses:
        '200':
          description: Agent deletion attempt completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
              example:
                deleted: true
                error: null
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    AgentId:
      name: id
      in: path
      description: Agent identifier.
      required: true
      schema:
        type: string
        example: agt_123
    PublishedWorkflowId:
      name: id
      in: path
      description: Published workflow identifier.
      required: true
      schema:
        type: string
        example: pub_123
    ReviewSubmissionId:
      name: id
      in: path
      description: Review submission identifier.
      required: true
      schema:
        type: string
        example: rev_123
    BountyId:
      name: bountyId
      in: path
      description: Bounty identifier.
      required: true
      schema:
        type: string
        example: bty_123
    BountyIdAsId:
      name: id
      in: path
      description: Bounty identifier.
      required: true
      schema:
        type: string
        example: bty_123
    SessionId:
      name: sessionId
      in: path
      description: Chat session identifier.
      required: true
      schema:
        type: string
        example: sess_123
    SubmissionId:
      name: submissionId
      in: path
      description: Bounty submission identifier.
      required: true
      schema:
        type: string
        example: sub_123
    AutomationId:
      name: id
      in: path
      description: Automation identifier.
      required: true
      schema:
        type: string
        example: auto_123
  responses:
    BadRequestError:
      description: Invalid request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
    UnauthorizedError:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden
    NotFoundError:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not found
    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Conflict
    UnprocessableEntityError:
      description: Semantic validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unprocessable entity
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Internal server error
  schemas:
    HealthResponse:
      type: object
      description: Permissive health response payload for a service.
      additionalProperties: true
      example:
        status: ok
    Error:
      type: object
      description: Generic error response.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: Internal server error
    DeleteAgentResponse:
      type: object
      description: Result of deleting an agent from the AI service search index.
      required:
        - deleted
        - error
      properties:
        deleted:
          type: boolean
          description: Whether the delete operation succeeded.
          example: true
        error:
          type: string
          nullable: true
          description: Error message when deletion fails.
          example: null
    BountySpec:
      type: object
      description: Normalized bounty specification derived from chat answers.
      required:
        - trigger
        - apps
        - output
        - rules
        - task
      properties:
        trigger:
          type: object
          required:
            - kind
            - detail
          properties:
            kind:
              type: string
              example: app_event
            detail:
              type: string
              example: New form submission
        apps:
          type: array
          items:
            type: string
          example:
            - slack
            - hubspot
        output:
          type: object
          required:
            - kind
            - detail
          properties:
            kind:
              type: string
              example: app_action
            detail:
              type: string
              example: Post lead details to a Slack channel
        rules:
          type: array
          items:
            type: string
          example:
            - Include lead source
        task:
          type: string
          example: Build a lead notification automation.
    AutomationView:
      type: object
      description: Automation view returned from the automations API.
      required:
        - id
        - name
        - description
        - steps
        - lastRunAt
        - totalRuns
        - publishedWorkflowId
        - originSessionId
        - connectedTools
      properties:
        id:
          type: string
          example: auto_123
        name:
          type: string
          example: CRM Sync
        description:
          type: string
          example: Syncs new leads into the CRM.
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
            - type: trigger
              name: Webhook
            - type: action
              name: Create Contact
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-20T09:00:00Z'
        totalRuns:
          type: number
          format: double
          example: 17
        publishedWorkflowId:
          type: string
          nullable: true
          example: pub_123
        originSessionId:
          type: string
          nullable: true
          example: sess_123
        connectedTools:
          type: array
          items:
            type: object
            required:
              - pieceName
              - status
              - externalId
            properties:
              pieceName:
                type: string
                example: '@activepieces/piece-hubspot'
              status:
                type: string
                example: connected
              externalId:
                type: string
                example: conn_123
    ReviewSubmissionRow:
      type: object
      description: Review submission row for the caller.
      required:
        - id
        - status
        - updatedAt
        - resumeState
        - checksDecision
        - contentHash
        - createdAt
      properties:
        id:
          type: string
          example: rev_123
        status:
          type: string
          enum:
            - checking
            - pending
            - approved
            - rejected
          example: pending
        publishedWorkflowId:
          type: string
          nullable: true
          example: null
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-15T12:30:00Z'
        resumeState:
          type: object
          nullable: true
          additionalProperties: true
          example: null
        checksDecision:
          type: object
          nullable: true
          additionalProperties: true
          example: null
        contentHash:
          type: string
          example: sha256:abc123
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T12:00:00Z'
    VerifyAgentDto:
      type: object
      description: Request payload for agent verification streaming.
      properties:
        source:
          type: string
          nullable: true
          enum:
            - publish
            - bounty
            - requested
          example: publish
        sourceId:
          type: string
          nullable: true
          example: wf_123
        platforms:
          type: array
          items:
            type: string
          example:
            - slack
            - google-sheets
        categories:
          type: array
          items:
            type: string
          example:
            - productivity
        workflowSteps:
          type: array
          items:
            type: string
          example:
            - Trigger
            - Publish Gate
        useCases:
          type: array
          items:
            type: string
          example:
            - Lead routing
        builderQuestions:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
            - question: What inputs are required?
              answer: A webhook payload with email and company fields.
        testContext:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            draftFlowId:
              type: string
              example: draft_123
            answers:
              type: object
              additionalProperties: true
              example:
                trigger: Webhook
                output: Update CRM
            consumerInputs:
              type: array
              items:
                type: object
                additionalProperties: true
              example:
                - name: apiKey
                  type: secret
            contentHash:
              type: string
              example: sha256:abc123
    CreateBountyDto:
      type: object
      description: Request payload for creating a bounty.
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          example: sess_123
        title:
          type: string
          example: Build a Slack lead notifier
        summary:
          type: string
          example: Create an automation that posts new leads to Slack.
        answers:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            trigger:
              type: string
              example: New form submission
            apps:
              type: array
              items:
                type: string
              example:
                - slack
                - hubspot
            output:
              type: string
              example: Post lead details to a Slack channel
        amount:
          type: number
          format: double
          example: 250
        currency:
          type: string
          example: USD
    PreviewBountyDto:
      type: object
      description: Request payload for previewing a bounty.
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          example: sess_123
        answers:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            trigger:
              type: string
              example: New Typeform response
            apps:
              type: array
              items:
                type: string
              example:
                - slack
                - notion
            output:
              type: string
              example: Save the response to Notion and alert Slack
    CreateBountySubmissionDto:
      type: object
      description: Request payload for submitting a bounty solution.
      required:
        - workflowJson
      properties:
        workflowJson:
          type: object
          additionalProperties: true
          example:
            version: 1
            steps:
              - name: Trigger
                type: webhook
              - name: Publish Gate
                type: publish_gate
        builderQuestions:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
            - question: Any required credentials?
              answer: Slack bot token and CRM API key.
    AcceptSubmissionDto:
      type: object
      description: Request payload for accepting a bounty submission.
      properties:
        consumerCopyId:
          type: string
          nullable: true
          example: copy_123
        scheduleConfig:
          type: object
          nullable: true
          additionalProperties: true
          example:
            cron: 0 9 * * *
            timezone: UTC
    UpdateSubmissionStatusDto:
      type: object
      description: Request payload for updating a bounty submission status.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - submitted
            - shortlisted
            - rejected
          example: shortlisted
    VerifyBountyOrderDto:
      type: object
