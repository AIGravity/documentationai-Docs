                  - orderId
                  - amount
                  - currency
                properties:
                  orderId:
                    type: string
                    example: order_RZP_123
                  amount:
                    type: number
                    format: double
                    example: 250
                  currency:
                    type: string
                    example: USD
              example:
                orderId: order_RZP_123
                amount: 250
                currency: USD
        '400':
          description: Razorpay not configured, bounty not pending payment, or amount is zero
