openapi: '3.0.3'
info:
  version: 1.0.0
  title: AIGravity Core API Service
  description: |
    This specification documents the full API surface for the AIGravity/core monorepo, including the NestJS application API and the internal AI service API.

    Getting started:
    1. Use the NestJS API server at `http://localhost:3000` for product-facing operations such as agents, bounties, automations, apps, marketplace runs, and the public leaderboard.
    2. Use the AI service server at `http://localhost:8000` for internal AI service operations described in this document.
    3. Authenticate protected NestJS endpoints with a Bearer JWT in the `Authorization` header: `Authorization: Bearer <token>`.

    Authentication:
    - Most NestJS endpoints require Bearer authentication.
    - Public endpoints are `GET /health` and `GET /api/leaderboard/builders`.
    - The internal AI service deletion endpoint `DELETE /internal/agents/{agent_id}` is documented as unauthenticated.

    Usage notes:
    - The `/api/agents/verify-stream` endpoint returns Server-Sent Events with media type `text/event-stream`.
    - Bounty payment flows use Razorpay order creation and payment verification.
    - Marketplace execution and result settlement support agent execution and run reconciliation workflows.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3000
    description: API service local development server
  - url: http://localhost:8000
    description: AI service local development server
tags:
  - name: Health
    description: Service health and readiness
  - name: Agents
    description: Agent management, review lifecycle, and verification
  - name: Bounties
    description: Bounty creation, preview, submissions, and payments
  - name: Automations
    description: Automation listing, detail, and tool management
  - name: Apps
    description: App connections management
  - name: Marketplace
    description: Marketplace execution and run results
  - name: Leaderboard
    description: Public builder leaderboard
  - name: AI Service Internal
    description: Internal AI service operations
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health
      description: Returns a simple health response for the service exposed on the selected server.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is reachable and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/mine/{id}:
    get:
      tags:
        - Agents
      summary: Get one of the caller's agents
      description: Returns a single agent owned by the authenticated caller. Returns 404 if the agent does not exist or belongs to another builder.
      operationId: getMyAgentById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: agt_123
                name: Lead Enrichment Agent
                description: Enriches new inbound leads and updates CRM records.
                status: active
                workflowJson:
                  version: 1
                  steps: []
                createdAt: '2026-01-10T10:00:00Z'
                updatedAt: '2026-01-15T12:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Agent not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Agents
      summary: Delete one of the caller's agents
      description: Deletes a single agent owned by the authenticated caller. Returns 404 if the agent does not exist or belongs to another builder.
      operationId: deleteMyAgentById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
                    example: true
              example:
                deleted: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Agent not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/verify-stream:
    post:
      tags:
        - Agents
      summary: Submit agent for verification with streaming
      description: Submits an agent verification request and returns a Server-Sent Events stream containing verification progress. Existing rows may be enriched instead of creating duplicates, and stale auto-rejected rows for the same content hash are deleted before re-run.
      operationId: verifyAgentStream
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAgentDto'
            example:
              source: publish
              sourceId: wf_123
              platforms:
                - slack
                - google-sheets
              categories:
                - productivity
              workflowSteps:
                - Trigger
                - Transform
                - Publish Gate
              useCases:
                - Lead routing
              builderQuestions:
                - question: What inputs are required?
                  answer: A webhook payload with email and company fields.
              testContext:
                draftFlowId: draft_123
                answers:
                  trigger: Webhook
                  output: Update CRM
                consumerInputs:
                  - name: apiKey
                    type: secret
                contentHash: sha256:abc123
      responses:
        '200':
          description: Verification stream opened
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: progress\ndata: {\"status\":\"checking\"}\n\n"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/mine/reviews:
    get:
      tags:
        - Agents
      summary: List the caller's agent review submissions
      description: Returns all review submissions created by the authenticated caller.
      operationId: listMyAgentReviews
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review submissions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewSubmissionRow'
              example:
                - id: rev_123
                  status: pending
                  publishedWorkflowId: null
                  updatedAt: '2026-01-15T12:30:00Z'
                  resumeState: null
                  checksDecision: null
                  contentHash: sha256:abc123
                  createdAt: '2026-01-15T12:00:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/admin/running-automations:
    get:
      tags:
        - Agents
      summary: List running automation rollups
      description: Returns admin-visible rollups of running automations per published agent.
      operationId: listAdminRunningAutomations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Running automation rollups returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunningAutomationRollup'
              example:
                - id: pub_123
                  name: Invoice Reminder Agent
                  description: Sends reminder emails for unpaid invoices.
                  steps:
                    - type: trigger
                      name: Schedule
                    - type: action
                      name: Send Email
                  lastRunAt: '2026-01-20T08:00:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/admin/running-automations/{id}:
    get:
      tags:
        - Agents
      summary: Get one running automation rollup
      description: Returns admin-visible detail for a single running automation rollup identified by published workflow ID.
      operationId: getAdminRunningAutomationById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublishedWorkflowId'
      responses:
        '200':
          description: Running automation rollup detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningAutomationRollupDetail'
              example:
                id: pub_123
                name: Invoice Reminder Agent
                description: Sends reminder emails for unpaid invoices.
                steps:
                  - type: trigger
                    name: Schedule
                  - type: action
                    name: Send Email
                lastRunAt: '2026-01-20T08:00:00Z'
                totalRuns: 42
                reviewNote:
                  kind: automation_stats
                  totalRuns: 42
                  creditsUsed: 19.5
                  lastRunAt: '2026-01-20T08:00:00Z'
                  activeUsers: 12
                  pausedUsers: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/admin/pending/{id}:
    get:
      tags:
        - Agents
      summary: Get pending review detail
      description: Returns admin detail for a pending review submission. If the submission is still in automated checking, the endpoint returns 400.
      operationId: getAdminPendingAgentReviewById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewSubmissionId'
      responses:
        '200':
          description: Pending review detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReviewDetail'
              example:
                id: rev_123
                status: pending
                publishedWorkflowId: null
                resumeState: null
                checks:
                  score: 91
                totalEarnings: 123.45
        '400':
          description: Submission has not finished automated checks yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Submission has not finished automated checks yet.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/agents/approve/{id}:
    post:
      tags:
        - Agents
      summary: Approve a pending agent review
      description: Approves a pending agent review, flips status to approved, and sets the published workflow ID so the builder dashboard card persists. If the submission is still in automated checking, the endpoint returns 400.
      operationId: approveAgentReviewById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewSubmissionId'
      responses:
        '200':
          description: Review approved
          content:
            application/json:
              schema:
                type: object
                required:
                  - approved
                  - publishedWorkflowId
                properties:
                  approved:
                    type: boolean
                    example: true
                  publishedWorkflowId:
                    type: string
                    description: ID of the published workflow created or associated during approval.
                    example: pub_123
              example:
                approved: true
                publishedWorkflowId: pub_123
        '400':
          description: Submission has not finished automated checks yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Submission has not finished automated checks yet.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties:
    post:
      tags:
        - Bounties
      summary: Create a bounty
      description: Creates a bounty for the authenticated caller. The operation is idempotent per chat session and returns an existing bounty if one already exists with status `open` or `pending_payment`.
      operationId: createBounty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBountyDto'
            example:
              sessionId: sess_123
              title: Build a Slack lead notifier
              summary: Create an automation that posts new leads to Slack.
              answers:
                trigger: New form submission
                apps:
                  - slack
                  - hubspot
                output: Post lead details to a Slack channel
              amount: 250
              currency: USD
      responses:
        '201':
          description: Bounty created or existing bounty returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBountyResponse'
              example:
                id: bty_123
                title: Build a Slack lead notifier
                summary: Create an automation that posts new leads to Slack.
                expiresAt: '2026-02-01T00:00:00Z'
                paymentRequired: true
                amount: 250
                currency: USD
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/preview:
    post:
      tags:
        - Bounties
      summary: Preview a bounty
      description: Generates a bounty preview from chat answers, including validity, buildability, and a normalized bounty specification.
      operationId: previewBounty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewBountyDto'
            example:
              sessionId: sess_123
              answers:
                trigger: New Typeform response
                apps:
                  - slack
                  - notion
                output: Save the response to Notion and alert Slack
      responses:
        '200':
          description: Bounty preview generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyPreviewResponse'
              example:
                summary: Save Typeform responses to Notion and notify Slack.
                title: Typeform to Notion with Slack alert
                valid: true
                issues: []
                platforms:
                  - slack
                  - notion
                tools:
                  - typeform
                  - notion
                  - slack
                useCases:
                  - lead capture
                spec:
                  trigger:
                    kind: app_event
                    detail: New Typeform response
                  apps:
                    - slack
                    - notion
                  output:
                    kind: app_action
                    detail: Save to Notion and send Slack notification
                  rules:
                    - Include respondent name and email
                  task: Build an automation from Typeform to Notion with Slack notifications.
                buildable: true
                buildableReason: Supported apps and flow pattern detected.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/draft-brief:
    post:
      tags:
        - Bounties
      summary: Generate a draft bounty brief
      description: Generates a draft bounty brief and a suggested title from an existing chat session.
      operationId: generateBountyDraftBrief
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
              properties:
                sessionId:
                  type: string
                  description: Chat session ID used to derive the draft brief.
                  example: sess_123
            example:
              sessionId: sess_123
      responses:
        '200':
          description: Draft brief generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - brief
                  - suggestedTitle
                properties:
                  brief:
                    type: string
                    description: Draft bounty brief text.
                    example: Build an automation that captures inbound leads, enriches them, and sends them to Slack and the CRM.
                  suggestedTitle:
                    type: string
                    description: Suggested title for the bounty.
                    example: Lead capture and routing automation
              example:
                brief: Build an automation that captures inbound leads, enriches them, and sends them to Slack and the CRM.
                suggestedTitle: Lead capture and routing automation
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{bountyId}/submit:
    post:
      tags:
        - Bounties
      summary: Submit a bounty solution
      description: Submits a workflow solution for a bounty. The workflow JSON must include a Publish Gate step or the request fails with 400.
      operationId: submitBountySolution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBountySubmissionDto'
            example:
              workflowJson:
                version: 1
                steps:
                  - name: Trigger
                    type: webhook
                  - name: Publish Gate
                    type: publish_gate
              builderQuestions:
                - question: Any required credentials?
                  answer: Slack bot token and CRM API key.
      responses:
        '201':
          description: Bounty submission created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - bountyId
                  - status
                properties:
                  id:
                    type: string
                    example: sub_123
                  bountyId:
                    type: string
                    example: bty_123
                  status:
                    type: string
                    example: submitted
              example:
                id: sub_123
                bountyId: bty_123
                status: submitted
        '400':
          description: Missing Publish Gate step in workflow JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Workflow must include a Publish Gate step.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}:
    get:
      tags:
        - Bounties
      summary: Get bounty details
      description: Returns details for a single bounty visible to the authenticated caller.
      operationId: getBountyById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyIdAsId'
      responses:
        '200':
          description: Bounty returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bounty'
              example:
                id: bty_123
                title: Build a Slack lead notifier
                summary: Create an automation that posts new leads to Slack.
                status: open
                expiresAt: '2026-02-01T00:00:00Z'
                sessionId: sess_123
                awardedTo: null
                spec:
                  trigger:
                    kind: app_event
                    detail: New form submission
                  apps:
                    - slack
                    - hubspot
                  output:
                    kind: app_action
                    detail: Post lead details to a Slack channel
                  rules:
                    - Include lead source
                  task: Build a lead notification automation.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/by-session/{sessionId}:
    get:
      tags:
        - Bounties
      summary: Get bounty by session ID
      description: Returns a bounty associated with the specified chat session ID.
      operationId: getBountyBySessionId
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Bounty returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bounty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bounty not found for session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Bounty not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/mine/updates:
    get:
      tags:
        - Bounties
      summary: Get bounty updates for the caller
      description: Returns update rollups for bounties owned by the authenticated caller.
      operationId: listMyBountyUpdates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bounty updates returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BountyUpdate'
              example:
                - id: bty_123
                  title: Build a Slack lead notifier
                  status: open
                  submissionsCount: 3
                  lastSubmissionAt: '2026-01-20T10:00:00Z'
                  submissionsLastSeenAt: '2026-01-20T11:00:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}/submissions:
    get:
      tags:
        - Bounties
      summary: List submissions for a bounty
      description: Returns all submissions for a bounty. Only the bounty creator may access this endpoint.
      operationId: listBountySubmissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyIdAsId'
      responses:
        '200':
          description: Bounty submissions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BountySubmission'
              example:
                - id: sub_123
                  bountyId: bty_123
                  builderId: bld_123
                  builderName: Alex Builder
                  status: submitted
                  submittedAt: '2026-01-20T10:00:00Z'
                  builderQuestions:
                    - question: Are paid APIs allowed?
                      answer: Yes, if clearly documented.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}/submissions/{submissionId}/status:
    patch:
      tags:
        - Bounties
      summary: Update a bounty submission status
      description: Updates the status of a bounty submission. Only the bounty creator may access this endpoint. The `accepted` status is not allowed here and must use the accept endpoint.
      operationId: updateBountySubmissionStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyIdAsId'
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubmissionStatusDto'
            example:
              status: shortlisted
      responses:
        '200':
          description: Submission status updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                    example: sub_123
                  status:
                    type: string
                    example: shortlisted
              example:
                id: sub_123
                status: shortlisted
        '400':
          description: Bounty not revealed or not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Bounty must be revealed and open before updating submission status.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Caller is not the bounty creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Forbidden
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}/submissions/{submissionId}/ensure-runnable:
    post:
      tags:
        - Bounties
      summary: Check whether a submission is runnable
      description: Checks whether a bounty submission can be activated.
      operationId: ensureBountySubmissionRunnable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyIdAsId'
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Runnable check completed
          content:
            application/json:
              schema:
                type: object
                required:
                  - runnable
                  - reason
                properties:
                  runnable:
                    type: boolean
                    example: true
                  reason:
                    type: string
                    nullable: true
                    example: null
              example:
                runnable: true
                reason: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}/submissions/{submissionId}/accept:
    post:
      tags:
        - Bounties
      summary: Accept a bounty submission
      description: Accepts a bounty submission and activates the agent. On failure, the bounty is reverted to `open` and the submission is reverted to its prior status.
      operationId: acceptBountySubmission
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BountyIdAsId'
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptSubmissionDto'
            example:
              consumerCopyId: copy_123
              scheduleConfig:
                cron: 0 9 * * *
                timezone: UTC
      responses:
        '200':
