            application/json:
              schema:
                type: object
                required:
                  - activated
                  - agentId
                properties:
                  activated:
                    type: boolean
                    example: true
                  agentId:
                    type: string
                    example: agt_activated_123
              example:
                activated: true
                agentId: agt_activated_123
        '400':
          description: Agent cannot be made runnable or required activation input is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: consumerCopyId is required for subscription agents.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bounties/{id}/pay/order:
