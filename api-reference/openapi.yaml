openapi: '3.0.0'
info:
  version: 1.0.0
  title: AIGravity Core API Service
  description: |
    This specification documents the API service for the AIGravity/core monorepo.

    It covers the NestJS API service health endpoint exposed at `GET /health` and unauthenticated telemetry endpoints at `/api/telemetry/loading-durations` for tracking rolling-average loading phase durations.

    The repository also contains a separate AI service implemented with FastAPI that exposes its own `GET /health` endpoint. That endpoint is not described in this API reference specification.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AIGravity
    url: https://aigravity.dev
    email: support@aigravity.dev
servers:
  - url: http://localhost:3001
    description: API service local development server
tags:
  - name: Health
    description: Service health and readiness operations for the API service
  - name: Telemetry
    description: Loading duration tracking endpoints (unauthenticated)
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get API service health
      description: Returns a simple health response for the AIGravity/core API service.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API service is reachable and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/telemetry/loading-durations:
    get:
      tags:
        - Telemetry
      summary: Get loading duration statistics
      description: Returns the global rolling-average duration for each tracked loading phase. This endpoint is intentionally unauthenticated because anonymous visitors generate most loading events.
      operationId: getLoadingDurations
      security: []
      responses:
        '200':
          description: Rolling-average durations for all tracked loading phases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadingDurationsResponse'
              example:
                durations:
                  analyzing:submit_prompt:
                    avgMs: 6000
                    n: 42
                  connecting:
                    avgMs: 2000
                    n: 18
                  executing:
                    avgMs: 20000
                    n: 7
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Telemetry
      summary: Record a loading duration
      description: Records a single completed loading-phase duration into its rolling average. The duration is clamped to the range 50-600000 ms before being stored.
      operationId: recordLoadingDuration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordLoadingDurationRequest'
      responses:
        '201':
          description: Duration recorded successfully (no response body)
        '400':
          description: Invalid request - opKey is not in the allowlist or durationMs is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthResponse:
      type: object
      description: Permissive health response payload for the API service.
      additionalProperties: true
      example:
        status: ok
    Error:
      type: object
      description: Generic error response.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: Internal server error
    LoadingDurationsResponse:
      type: object
      description: Rolling-average loading durations keyed by operation key.
      required:
        - durations
      properties:
        durations:
          type: object
          description: Map of operation keys to duration statistics. Each value contains avgMs (rolling-average duration in milliseconds) and n (sample count).
          additionalProperties:
            type: object
            properties:
              avgMs:
                type: number
              n:
                type: integer
    RecordLoadingDurationRequest:
      type: object
      description: Request body for recording a loading phase duration.
      required:
        - opKey
        - durationMs
      properties:
        opKey:
          type: string
          description: The operation key identifying which loading phase was measured. Allowed values include analyzing:submit_prompt, analyzing:select_intent, analyzing:submit_tools, connecting, deploying, executing, and executing: followed by an agent identifier.
          example: connecting
        durationMs:
          type: number
          description: Duration of the loading phase in milliseconds. Clamped to 50-600000 ms.
          example: 1800